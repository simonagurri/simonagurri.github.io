# HugoBlox Font Pack — replica of the old Anatole site typography
# Anatole body font stack (assets/scss/partials/_base.scss):
#   'PingHei', 'PingFang SC', 'Helvetica Neue', 'Work Sans', 'Hiragino Sans GB', sans-serif
# The Latin-visible / web-loadable face in that stack is Work Sans (a Google font,
# a Helvetica-like grotesque). Used here for both headings and body to match the
# old site's clean single-family sans-serif look.
# https://docs.hugoblox.com

hugoblox:
  meta:
    format: "hugoblox-font@1"
    name: "Anatole"
    vendor: "custom"
    version: "1.0.0"
    license: "MIT"
    style: "sans"
    description: "Work Sans — replica of the old Anatole site's sans-serif"

  families:
    heading: "Work Sans"
    body: "Work Sans"
    code: "Source Code Pro"

  weights:
    heading: [500, 600, 700]
    body: [400, 500, 600]
    code: [400]

  leading:
    heading: 1.25
    body: 1.6
    code: 1.5

  tracking:
    heading: "0"
    body: "0"
    caps: "0.05em"

  variable:
    heading: true
    body: true
    code: false
