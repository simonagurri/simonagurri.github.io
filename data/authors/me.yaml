experience:
  - role: Research Fellow — B4IA project
    org: Politecnico di Torino
    start: 2025-10-01
    summary: |
      Design and prototyping (TRL 6) of an autonomous bus with a PFI
      hydrogen-fuelled internal combustion engine. 1D and 3D CFD of the
      injection system and combustion chamber; GT-Power modeling and
      combustion calibration against experimental CNG data from FPT
      Industrial; chemical kinetics analysis in Cantera. Project funded
      by the Italian Ministry of Enterprises (MIMIT).
  - role: Doctoral Researcher
    org: Politecnico di Torino
    start: 2021-11-01
    end: 2025-10-31
    summary: |
      Advanced 3D reactive CFD of turbulence-combustion interactions in
      low-carbon fuel engines (CONVERGE, RNG k-ε), validated against FPT
      Industrial data. Developed a new boundary-condition optimization
      strategy (Applied Thermal Engineering) and a physics-based spark
      discharge model for cycle-to-cycle variability. Chemical mechanism
      benchmarking (0D-to-3D). Large parallel simulations on CINECA HPC.
      Secondary track in freight-transport and mobility systems.
  - role: Teaching Assistant
    org: Politecnico di Torino
    start: 2022-09-01
    end: 2026-03-31
    summary: |
      140+ hours taught on Fluid Machinery, Model-Based Systems
      Engineering and Transportation Systems in MSc courses of Mechanical
      and Civil Engineering, plus an Executive Master. Supervised 20+ MSc
      theses. Top student-feedback scores (avg. 3.89/4) for three years.
  - role: Contract Professor
    org: Università della Calabria
    start: 2024-07-01
    end: 2024-07-31
    summary: |
      Delivered a course on theory and numerical applications through
      direct data collection from vehicles, in the II-level Master on
      Electric Mobility and Circular Economy (MEES).
  - role: Process Engineering Intern
    org: Alstom S.A., Savigliano
    start: 2020-09-01
