  - title: Transportation Systems Research
    description: 'Research projects focusing on sustainable and efficient transportation systems'
    portfolioitem:
      - name: Next-Generation Freight Train Design
        image: 'images/portfolio/femu.png'
        description: |
          Functional design of a next-generation freight train with distributed power. Used System Composer for architecture design and requirement management, and Simulink for simulating and validating the Integrated Monitoring System.

          **[Read the paper on the _cruising speed_ here!](https://doi.org/10.57597/IF.05.2023.ART.1)**
          
          **[Read the paper on the _integrated monitoring system_ here!](https://doi.org/10.4203/ccc.7.8.3)**

          **[Read the paper on _GNSS positioning for manoeuvring_ here!](https://doi.org/10.57597/IF.06.2025.ART.1)**
        status: 'Finished'
        start: '2021'
        end: '2025'
        tags:
          - System Engineering
          - Railway
          - Simulation
      - name: Intermodal Logistic Chain Simulation
        image: 'images/portfolio/logistics.jpg'
        description: |
          Simulation of next-generation freight train operation and integration in intermodal logistic chains using OpenTrack, Trenissimo, Anylogic, and ARENA Discrete Events Simulation.

           **[Read the paper here!](https://doi.org/10.1016/j.cstp.2026.101774)**
        status: 'Finished'
        start: '2021'
        end: '2026'
        tags:
          - Logistics
          - Simulation
          - Intermodal Transport
      - name: Electric Yard Tractor Analysis
        image: 'images/portfolio/yardtractor.png'
        description: |
          Conducted techno-economic analysis on electric yard tractors, including GPS and accelerometer data collection, in partnership with PSA Port of Genova.

          **[Read the paper here!](http://dx.doi.org/10.2174/0126671212308027240430114324)**
        status: 'Published'
        start: '2023'
        end: '2024'
        tags:
          - Electric Vehicles
          - Data Analysis
          - Port Operations
      - name: Electric Bus Consumption vs Temperature
        image: 'images/portfolio/buselt.png'
        description: 'Battery electric buses for Public transport: a methodological approach and results on energy consumption at different temperatures. Data analysis on fleet monitoring by Gruppo Torinese Trasporti.'
        status: 'Under Review'
        start: '2024'
        end: '2025'
        tags:
          - Electric Vehicles
          - Data Analysis
          - Public Transport
      - name: Urban vs Extraurban driving behaviors of European cars
        image: 'images/portfolio/suppDemand.png'
        description: |
          Large-scale mobility pattern analysis and powertrain optimization. Processed 200k-vehicle European dataset using Python/Pandas to identify urban/extra-urban driving cycles. Developed k-means clustering model grouping vehicles by usage patterns, enabling targeted powertrain choice. Data provided by Stellantis

          **[Read the paper here!](https://doi.org/10.1016/j.treng.2025.100355)**
        status: 'Published'
        start: '2023'
        end: '2025'
        tags:
          - Personal mobility
          - Data Analysis
